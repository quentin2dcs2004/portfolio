<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder portrait</title>
  <desc id="desc">Emplacement photo — a remplacer par une vraie photo de Quentin</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a3a"/>
      <stop offset="50%" stop-color="#0a0818"/>
      <stop offset="100%" stop-color="#061338"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#2f6bff"/>
    </linearGradient>
  </defs>
  <rect width="720" height="900" fill="url(#bg)"/>
  <rect x="24" y="24" width="672" height="852" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="10 12" opacity="0.7"/>
  <circle cx="360" cy="340" r="110" fill="none" stroke="#9b5cff" stroke-width="3" opacity="0.5"/>
  <circle cx="360" cy="310" r="48" fill="#14143a" stroke="#2f6bff" stroke-width="2" opacity="0.85"/>
  <path d="M260 470c20-70 80-100 100-100s80 30 100 100" fill="none" stroke="#2f6bff" stroke-width="3" opacity="0.75"/>
  <text x="360" y="580" text-anchor="middle" fill="#9b5cff" font-family="Syne, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">PLACEHOLDER</text>
  <text x="360" y="620" text-anchor="middle" fill="#9aa3c7" font-family="Sora, Arial, sans-serif" font-size="18">Photo de Quentin — a venir</text>
  <text x="360" y="660" text-anchor="middle" fill="#9aa3c7" font-family="Sora, Arial, sans-serif" font-size="14">Remplacer image/placeholder-portrait.svg</text>
  <rect x="200" y="720" width="320" height="3" fill="url(#accent)" opacity="0.9"/>
</svg>
