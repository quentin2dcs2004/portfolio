<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meetora — admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topnav">
        <a class="brand" href="/">Meetora</a>
        <nav class="nav-links">
          <a href="/">Souscrire (web)</a>
          <a href="/compte.html">Compte</a>
          <a href="/admin.html" aria-current="page">Admin</a>
        </nav>
      </header>

      <section class="hero">
        <h1>Back-office</h1>
        <p>Durées, tarifs, promotions, renouvellements, analytics et export CSV.</p>
      </section>

      <section class="panel" style="margin-bottom: 1rem">
        <div class="form-row">
          <div class="field" style="margin: 0">
            <label for="token">Jeton admin</label>
            <input id="token" type="password" value="quentin-admin" />
          </div>
          <div class="field" style="margin: 0; align-self: end">
            <button type="button" class="btn btn-primary" id="boot-btn" style="width: auto">Charger</button>
          </div>
        </div>
      </section>

      <div class="admin-tabs" id="tabs">
        <button type="button" class="chip" data-tab="analytics" aria-pressed="true">Analytics</button>
        <button type="button" class="chip" data-tab="durations" aria-pressed="false">Durées</button>
        <button type="button" class="chip" data-tab="tariffs" aria-pressed="false">Tarifs</button>
        <button type="button" class="chip" data-tab="promos" aria-pressed="false">Promotions</button>
        <button type="button" class="chip" data-tab="subs" aria-pressed="false">Souscriptions</button>
      </div>

      <div id="panel-analytics" class="admin-panel"></div>
      <div id="panel-durations" class="admin-panel hidden"></div>
      <div id="panel-tariffs" class="admin-panel hidden"></div>
      <div id="panel-promos" class="admin-panel hidden"></div>
      <div id="panel-subs" class="admin-panel hidden"></div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
